<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1C1A"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </radialGradient>
    
    <!-- Walnut Wood Shelf Gradient -->
    <linearGradient id="walnutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D5B38"/>
      <stop offset="25%" stop-color="#673E23"/>
      <stop offset="70%" stop-color="#422513"/>
      <stop offset="100%" stop-color="#24140A"/>
    </linearGradient>

    <!-- Cassette Clear Acrylic Highlights -->
    <linearGradient id="cassettePlastic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="5%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="95%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Warm Chevron Stripes in 'A' -->
    <linearGradient id="chevronRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="chevronOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#EF6C00"/>
    </linearGradient>
    <linearGradient id="chevronYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>

    <!-- Drop Shadow for GRAIZ Logo -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Dark Squircle Icon Shape -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)"/>
  <!-- Subtle Outer Rim Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>

  <!-- ========================================== -->
  <!-- 1. TOP SECTION: REALISTIC CASSETTE TAPE   -->
  <!-- ========================================== -->
  <g transform="translate(68, 52)">
    <!-- Cassette Outer Clear Acrylic Shell -->
    <rect x="0" y="0" width="376" height="196" rx="14" fill="#1C1A18" fill-opacity="0.75" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2.5"/>
    <rect x="0" y="0" width="376" height="196" rx="14" fill="url(#cassettePlastic)"/>

    <!-- 4 Corner Screws -->
    <circle cx="16" cy="16" r="4.5" fill="#B0BEC5"/>
    <line x1="13.5" y1="16" x2="18.5" y2="16" stroke="#455A64" stroke-width="1.2"/>
    
    <circle cx="360" cy="16" r="4.5" fill="#B0BEC5"/>
    <line x1="357.5" y1="16" x2="362.5" y2="16" stroke="#455A64" stroke-width="1.2"/>

    <circle cx="16" cy="180" r="4.5" fill="#B0BEC5"/>
    <line x1="13.5" y1="180" x2="18.5" y2="180" stroke="#455A64" stroke-width="1.2"/>

    <circle cx="360" cy="180" r="4.5" fill="#B0BEC5"/>
    <line x1="357.5" y1="180" x2="362.5" y2="180" stroke="#455A64" stroke-width="1.2"/>

    <!-- Cassette Paper Label with Retro Stripes -->
    <rect x="26" y="22" width="324" height="116" rx="6" fill="#F5F3E9"/>
    
    <!-- Red Stripe -->
    <rect x="26" y="60" width="324" height="14" fill="#D32F2F"/>
    <!-- Orange Stripe -->
    <rect x="26" y="74" width="324" height="16" fill="#FB8C00"/>
    <!-- Golden Yellow Stripe -->
    <rect x="26" y="90" width="324" height="18" fill="#FFB300"/>

    <!-- Center Magnetic Tape Window (Trapezoid Cutout) -->
    <path d="M72,44 L304,44 L290,118 L86,118 Z" fill="#13100E" stroke="#E0E0E0" stroke-width="1.5"/>
    
    <!-- Magnetic Tape Spools / Reels -->
    <!-- Left Hub -->
    <circle cx="120" cy="81" r="28" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="120" cy="81" r="14" fill="#181513"/>
    <!-- Teeth -->
    <rect x="117.5" y="55" width="5" height="10" fill="#E0E0E0" rx="1"/>
    <rect x="117.5" y="97" width="5" height="10" fill="#E0E0E0" rx="1"/>
    <rect x="94" y="78.5" width="10" height="5" fill="#E0E0E0" rx="1"/>
    <rect x="136" y="78.5" width="10" height="5" fill="#E0E0E0" rx="1"/>

    <!-- Right Hub -->
    <circle cx="256" cy="81" r="28" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="256" cy="81" r="14" fill="#181513"/>
    <!-- Teeth -->
    <rect x="253.5" y="55" width="5" height="10" fill="#E0E0E0" rx="1"/>
    <rect x="253.5" y="97" width="5" height="10" fill="#E0E0E0" rx="1"/>
    <rect x="230" y="78.5" width="10" height="5" fill="#E0E0E0" rx="1"/>
    <rect x="272" y="78.5" width="10" height="5" fill="#E0E0E0" rx="1"/>

    <!-- Dark Brown Magnetic Tape Body -->
    <path d="M120,53 L256,53" stroke="#3E2723" stroke-width="5"/>
    <path d="M120,109 L256,109" stroke="#3E2723" stroke-width="5"/>

    <!-- Cassette Bottom Head Area -->
    <polygon points="56,148 320,148 300,188 76,188" fill="#24211E" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="106" cy="168" r="6" fill="#12100E"/>
    <circle cx="270" cy="168" r="6" fill="#12100E"/>
    <rect x="156" y="162" width="64" height="12" rx="3" fill="#B0BEC5" opacity="0.6"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. MIDDLE SECTION: WARM WALNUT WOOD SHELF  -->
  <!-- ========================================== -->
  <g transform="translate(36, 260)">
    <!-- Wooden Shelf Plank -->
    <rect x="0" y="0" width="440" height="26" fill="url(#walnutGrad)" rx="2"/>
    <!-- Top Shelf Bevel Highlight -->
    <line x1="0" y1="0.5" x2="440" y2="0.5" stroke="#B68058" stroke-width="2.5"/>
    <line x1="0" y1="3" x2="440" y2="3" stroke="#8D5B38" stroke-width="1"/>
    <!-- Deep Cavity Under-shelf Drop Shadow -->
    <rect x="0" y="26" width="440" height="14" fill="#000000" fill-opacity="0.8"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. LOWER SECTION: RACK OF CASSETTE SPINES  -->
  <!-- ========================================== -->
  <g transform="translate(42, 298)">
    <!-- Spine 1: Cream -->
    <rect x="0" y="0" width="28" height="162" rx="3" fill="#E8E4D9" stroke="#101010" stroke-width="1.5"/>
    <rect x="2" y="4" width="2" height="154" fill="#FFFFFF" opacity="0.6"/>
    <!-- Spine 2: Charcoal -->
    <rect x="30" y="0" width="30" height="162" rx="3" fill="#21201D" stroke="#101010" stroke-width="1.5"/>
    <rect x="32" y="4" width="2" height="154" fill="#FFFFFF" opacity="0.25"/>
    <!-- Spine 3: Deep Slate -->
    <rect x="62" y="0" width="30" height="162" rx="3" fill="#1B1917" stroke="#101010" stroke-width="1.5"/>
    <!-- Spine 4: Crimson Red -->
    <rect x="94" y="0" width="32" height="162" rx="3" fill="#B71C1C" stroke="#101010" stroke-width="1.5"/>
    <rect x="96" y="4" width="2" height="154" fill="#FFFFFF" opacity="0.4"/>
    <!-- Spine 5: Dark Charcoal -->
    <rect x="128" y="0" width="30" height="162" rx="3" fill="#262524" stroke="#101010" stroke-width="1.5"/>
    <!-- Spine 6: Warm Amber Gold -->
    <rect x="160" y="0" width="34" height="162" rx="3" fill="#E65100" stroke="#101010" stroke-width="1.5"/>
    <!-- Spine 7: Slate Black -->
    <rect x="196" y="0" width="32" height="162" rx="3" fill="#1E232A" stroke="#101010" stroke-width="1.5"/>
    <!-- Spine 8: Dark Charcoal -->
    <rect x="230" y="0" width="30" height="162" rx="3" fill="#2A2825" stroke="#101010" stroke-width="1.5"/>
    <!-- Spine 9: Warm Cream -->
    <rect x="262" y="0" width="34" height="162" rx="3" fill="#EFECE2" stroke="#101010" stroke-width="1.5"/>
    <!-- Spine 10: Deep Blue -->
    <rect x="298" y="0" width="30" height="162" rx="3" fill="#0D47A1" stroke="#101010" stroke-width="1.5"/>
    <!-- Spine 11: Vibrant Red -->
    <rect x="330" y="0" width="32" height="162" rx="3" fill="#C62828" stroke="#101010" stroke-width="1.5"/>
    <!-- Spine 12: Light Cream -->
    <rect x="364" y="0" width="30" height="162" rx="3" fill="#E8E4D9" stroke="#101010" stroke-width="1.5"/>
    <!-- Spine 13: Neutral -->
    <rect x="396" y="0" width="30" height="162" rx="3" fill="#2E2C29" stroke="#101010" stroke-width="1.5"/>
  </g>

  <!-- ========================================== -->
  <!-- 4. FOREGROUND: ICONIC BOLD 'GRAIZ' LOGO    -->
  <!-- ========================================== -->
  <g transform="translate(70, 334)" filter="url(#logoShadow)">
    <!-- Base Plate / Lettering in Retro Off-White -->
    <!-- 'G' -->
    <path d="M0,26 C0,11 11,0 26,0 L60,0 C70,0 76,7 76,17 L56,17 C56,14 53,12 48,12 L28,12 C20,12 14,18 14,26 L14,54 C14,62 20,68 28,68 L50,68 C55,68 58,65 58,60 L58,45 L40,45 L40,33 L72,33 L72,64 C72,74 65,80 50,80 L26,80 C11,80 0,69 0,54 Z" fill="#F8F6ED"/>

    <!-- 'R' -->
    <path d="M84,2 L124,2 C140,2 150,11 150,26 C150,37 142,45 130,48 L152,78 L134,78 L114,50 L100,50 L100,78 L84,78 Z M100,16 L100,36 L122,36 C129,36 134,32 134,26 C134,20 129,16 122,16 Z" fill="#F8F6ED"/>

    <!-- 'A' with distinctive triangular warm chevron -->
    <!-- Outer 'A' Frame -->
    <path d="M152,78 L188,2 L212,2 L248,78 L230,78 L218,52 L182,52 L170,78 Z M190,34 L210,34 L200,13 Z" fill="#F8F6ED"/>
    
    <!-- Signature Diagonal Chevron Stripes inside 'A' -->
    <polygon points="184,52 200,16 208,34 192,52" fill="url(#chevronRed)"/>
    <polygon points="192,52 208,34 214,44 198,52" fill="url(#chevronOrange)"/>
    <polygon points="198,52 214,44 218,52" fill="url(#chevronYellow)"/>

    <!-- 'I' -->
    <rect x="256" y="2" width="16" height="76" rx="2" fill="#F8F6ED"/>

    <!-- 'Z' -->
    <path d="M280,2 L344,2 L344,16 L302,64 L344,64 L344,78 L280,78 L280,64 L322,16 L280,16 Z" fill="#F8F6ED"/>
  </g>
</svg>